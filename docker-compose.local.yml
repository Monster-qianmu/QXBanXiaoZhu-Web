name: qxbanxiaozhu-8080
services:
  backend:
    image: qxbanxiaozhu-8080-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile.local
    environment:
      QXBAN_DATA_DIR: /app/data
      QXBAN_DB_PATH: /app/data/qxban.db
      QXBAN_PHOTO_BACKGROUND_ENABLED: "0"
      QXBAN_PHOTO_BACKGROUND_PREWARM_ENABLED: "0"
      QXBAN_PHOTO_TASK_CONCURRENCY: "1"
    volumes:
      - qxbanxiaozhu-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    image: qxbanxiaozhu-8080-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile.local
    ports:
      - "${QXBAN_BIND_ADDRESS:-0.0.0.0}:${QXBAN_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  qxbanxiaozhu-data:
